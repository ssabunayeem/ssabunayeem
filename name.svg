<svg fill="none" viewBox="0 0 800 90" width="800" height="90" xmlns="http://www.w3.org/2000/svg">

  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <style>
        /* ---------- GRADIENT ANIMATION ---------- */
        @keyframes gradientMove {
          0% {
            background-position: 0% 50%;
          }

          50% {
            background-position: 100% 50%;
          }

          100% {
            background-position: 0% 50%;
          }
        }

        /* ---------- GLOW PULSE ---------- */
        @keyframes glowPulse {
          0% {
            text-shadow: 0 0 8px rgba(196, 23, 248, 0.35);
          }

          50% {
            text-shadow: 0 0 16px rgba(56, 40, 202, 0.6);
          }

          100% {
            text-shadow: 0 0 8px rgba(196, 23, 248, 0.35);
          }
        }

        .container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100%;
        }

        .name {
          margin: 0;
          font-size: 2.2em;
          font-weight: 900;
          letter-spacing: -0.04em;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont,
            'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
            'Cantarell', 'Fira Sans', 'Droid Sans',
            'Helvetica Neue', sans-serif;

          background: linear-gradient(270deg,
              #3828ca,
              #c417f8,
              #3828ca);
          background-size: 300%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;

          animation:
            gradientMove 4s ease infinite,
            glowPulse 2.5s ease-in-out infinite;
        }
      </style>

      <h1 class="name">S. S. Abu Nayeem</h1>
    </div>
  </foreignObject>
</svg>