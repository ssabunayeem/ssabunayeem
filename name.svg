<svg fill="none" viewBox="0 0 800 80" width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientText {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        h1 {
          margin: 0;
          font-size: 2.2em;
          font-weight: 800;
          text-align: center;
          letter-spacing: -0.03em;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont,
            'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
            'Cantarell', 'Fira Sans', 'Droid Sans',
            'Helvetica Neue', sans-serif;

          background: linear-gradient(45deg, #f54bf5ff, #7b49f0ff);
          background-size: 200%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientText 3s ease infinite;
        }

        @keyframes snowflakes-fall {
          0% { top: -10%; }
          100% { top: 100%; }
        }

        @keyframes snowflakes-shake {
          0% { transform: translateX(0); }
          50% { transform: translateX(40px); }
          100% { transform: translateX(0); }
        }

        .snowflake {
          position: absolute;
          top: -10%;
          color: #ffffff;
          font-size: 0.9em;
          user-select: none;
          animation-name: snowflakes-fall, snowflakes-shake;
          animation-duration: 10s, 3s;
          animation-timing-function: linear, ease-in-out;
          animation-iteration-count: infinite, infinite;
        }

        .snowflake:nth-of-type(1) { left: 10%; animation-delay: 0s, 0s; }
        .snowflake:nth-of-type(2) { left: 30%; animation-delay: 2s, 1s; }
        .snowflake:nth-of-type(3) { left: 50%; animation-delay: 4s, 2s; }
        .snowflake:nth-of-type(4) { left: 70%; animation-delay: 1s, 0.5s; }
        .snowflake:nth-of-type(5) { left: 90%; animation-delay: 3s, 1.5s; }
      </style>

      <h1>S. S. Abu Nayeem</h1>

      <div class="snowflake">❅</div>
      <div class="snowflake">❅</div>
      <div class="snowflake">❅</div>
      <div class="snowflake">❅</div>
      <div class="snowflake">❅</div>
    </div>
  </foreignObject>
</svg>
